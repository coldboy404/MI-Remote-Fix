name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test routing
        run: python3 checks/test_focus.py
      - name: Build unsigned (push and PR)
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/build.py
      - name: Build signed (owner manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_PASSWORD"
          python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: remote-assistant-${{ github.sha }}
          path: |
            build/remote-assistant-unsigned.apk
            build/signed/*.apk
          if-no-files-found: error
